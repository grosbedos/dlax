# dlax: Slax's picom.conf without the options that only Slax's patched picom
# understands (xrender-round-top-only, xrender-window-outline*, rule "outline").
# Requires picom >= 12 (Debian 13) for the "rules" syntax.

# XRender keeps the desktop independent of OpenGL and GPU acceleration.
backend = "xrender";
vsync = true;
# Repaint the full frame to avoid stale pixels around moving translucent windows.
use-damage = false;
# Follow the window manager's active client, including explicit focus clearing.
use-ewmh-active-win = true;
corner-radius = 0;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
frame-opacity = 1;

shadow = false;

rules = (
   { match = "window_type != 'normal' && window_type != 'dialog' && role != 'slax-keyboard-popup' && role != 'slax-volume-popup'"; fade = false; },
   { match = "role *= 'fluxbox-toolbar'"; opacity = 0.7; },
   { match = "class_g = 'firefox-esr'"; opacity = 1; },
   # Round WM frames and opaque windows that cannot draw transparent corners.
   { match = "!override_redirect && border_width > 0"; corner-radius = 8; },
   { match = "!override_redirect && !argb && (window_type = 'normal' || window_type = 'dialog')"; corner-radius = 8; },
   { match = "role = 'fluxbox-menu'"; corner-radius = 8; },
   { match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_HORZ' && _NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT'"; corner-radius = 0; shadow = false; },
   { match = "fullscreen"; corner-radius = 0; shadow = false; }
);
